[versions]
# AGP 9.2.1, paired with the Gradle 9.x wrapper (pinned to 9.5.1 in gradle/wrapper/gradle-wrapper.properties).
agp = "9.2.1"

# Kotlin 2.x. The Compose compiler is now applied via the org.jetbrains.kotlin.plugin.compose
# Gradle plugin (versioned with Kotlin), replacing the old kotlinCompilerExtensionVersion.
# Held at 2.2.10 here: Kotlin 2.4.0 advances the Compose *compiler* two generations while the runtime
# stays at Compose 1.7 (BOM 2024.10), an untested pairing — it belongs with the Compose BOM / compileSdk
# platform upgrade, not this routine-bumps PR.
kotlin = "2.2.10"
coreKtx = "1.15.0"
# Splash screen API (Android 12 system splash, backported to API 23+).
coreSplashscreen = "1.2.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Core on-device test infra (ApplicationProvider, ActivityScenario, ActivityScenarioRule).
# Declared low; Gradle upgrades to whatever androidx.test.ext:junit pulls transitively.
androidxTestCore = "1.7.0"
androidxTestRules = "1.7.0"
appcompat = "1.7.1"
material = "1.14.0"
# Compose BOM: pins the Compose library versions. The Compose compiler itself tracks Kotlin (see [plugins]).
composeBom = "2024.10.01"
activityCompose = "1.9.3"
# 4.14+ is required to support Android SDK 35 (project targetSdk); 4.12.x maxed out at SDK 34.
robolectric = "4.16.1"
# Compose-adjacent AndroidX libraries (navigation / lifecycle / datastore), versioned independently of
# the Compose BOM above.
navigationCompose = "2.8.3"
lifecycleViewmodelCompose = "2.10.0"
datastore = "1.2.1"
glance = "1.1.1"
# Deferred background work: periodic widget refresh.
work = "2.11.2"
coroutines = "1.11.0"
# Kotlin code-coverage. 0.9.2+ is required for Gradle 9 — 0.8.x fails clean builds under Gradle 9
# (Kover doesn't create its tmp dir before writing kover-agent.args).
kover = "0.9.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons + downloadable Google Fonts are managed by the Compose BOM (no explicit version).
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# lifecycle-runtime-compose: LocalLifecycleOwner + repeatOnLifecycle, for pausing foreground tickers.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
androidx-glance-testing = { group = "androidx.glance", name = "glance-testing", version.ref = "glance" }
androidx-glance-appwidget-testing = { group = "androidx.glance", name = "glance-appwidget-testing", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Kotlin 2.0+ Compose compiler plugin (version tracks Kotlin).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
